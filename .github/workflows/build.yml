name: Build Minecraft Plugin

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Show Files & Build
      run: |
        echo "Listing all files in workspace:"
        find . -maxdepth 3
        
        # الانتقال لأول مجلد يحتوي على pom.xml وبنائه
        DIR=$(dirname $(find . -name "pom.xml" | head -n 1))
        cd "$DIR"
        mvn clean package

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FrontierEstate-JAR
        path: '**/target/*.jar'
