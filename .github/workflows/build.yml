name: Build Minecraft Plugin

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Auto-locate and Move Project Files
      run: |
        # البحث عن ملف pom.xml في أي مجلد فرعي ونقله للجذر الرئيسي للمستودع
        POM_DIR=$(dirname $(find . -name "pom.xml" -not -path "*/.*" | head -n 1))
        if [ "$POM_DIR" != "." ] && [ -n "$POM_DIR" ]; then
          echo "Moving files from $POM_DIR to root..."
          cp -r "$POM_DIR"/* .
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FrontierEstate-JAR
        path: target/*.jar
