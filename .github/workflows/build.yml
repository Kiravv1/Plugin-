name: Build Minecraft Plugin

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Fix Directory Structure
      run: |
        # إذا كان المجلد فرعي، سنقوم بنقل محتوياته للخارج لتكون في الواجهة مباشرة
        if [ -d "FrontierEstate" ]; then
          cp -r FrontierEstate/* .
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FrontierEstate-JAR
        path: target/*.jar
