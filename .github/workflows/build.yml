name: Build Minecraft Plugin

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build Project Automatically
      run: |
        # البحث عن ملف pom.xml والدخول لمجمله وبنائه مباشرة أينما كان
        POM=$(find . -name "pom.xml" -not -path "*/.*" | head -n 1)
        DIR=$(dirname "$POM")
        echo "Building inside: $DIR"
        cd "$DIR"
        mvn clean package

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FrontierEstate-JAR
        path: '**/target/*.jar'
