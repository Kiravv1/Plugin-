name: Build Minecraft Plugin

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Find and Build with Maven
      run: |
        POM_PATH=$(find . -name "pom.xml" -not -path "*/.*" | head -n 1)
        if [ -z "$POM_PATH" ]; then
          echo "Error: pom.xml not found!"
          exit 1
        }
        DIR=$(dirname "$POM_PATH")
        echo "Found pom.xml in: $DIR"
        cd "$DIR"
        mvn clean package

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FrontierEstate-JAR
        path: '**/target/*.jar'
