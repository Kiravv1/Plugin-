name: Build Minecraft Plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Unzip, locate pom.xml and build
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unzipping $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d extracted_files
          fi

          POM_FILE=$(find . -name "pom.xml" -not -path "*/target/*" | head -n 1)
          if [ -z "$POM_FILE" ]; then
            echo "ERROR: pom.xml not found anywhere!"
            find . -not -path "./.git/*" | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$POM_FILE")
          echo "Found pom.xml in: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          mvn -B clean package

          mkdir -p "$GITHUB_WORKSPACE/output_jar"
          cp target/FrontierEstate-*.jar "$GITHUB_WORKSPACE/output_jar/"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrontierEstate-JAR
          path: output_jar/*.jar
          if-no-files-found: error
