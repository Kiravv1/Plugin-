name: Build SurvivalPlus JAR

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Extract and Build with Maven
        run: |
          unzip -o "*.zip"
          POM_FILE=$(find . -name "pom.xml" | head -n 1)
          echo "Found POM at: $POM_FILE"
          mvn -B -f "$POM_FILE" clean package

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: SurvivalPlus-Plugin
          path: "**/target/*.jar"
          if-no-files-found: error
