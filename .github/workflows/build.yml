name: Build Minecraft Plugin

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: |
        # البحث عن ملف pom.xml وبناء المشروع في مكانه تلقائياً
        POM_FILE=$(find . -name "pom.xml" -not -path "*/.*" | head -n 1)
        if [ -z "$POM_FILE" ]; then
          echo "pom.xml not found!"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$POM_FILE")
        echo "Building project in: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        mvn clean package

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FrontierEstate-JAR
        path: '**/target/*.jar'
        if-no-files-found: error
